# Development override: mount source, run in watch mode, and use a separate DB so dev and prod data don't mix.
# Usage: docker compose -p ngrestaurant-dev -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Or:    npm run docker:dev:up
#
# API:  nest start --watch restarts when you change files in apps/api
# Web:  ng serve with --poll 200 rebuilds when you change files in apps/web
# DB:   postgres_data_dev volume (separate from prod postgres_data)

services:
  postgres:
    container_name: ngrestaurant-postgres-dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  api:
    container_name: ngrestaurant-api-dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-ngrestaurant}:${POSTGRES_PASSWORD:-ngrestaurant}@postgres:5432/${POSTGRES_DB:-ngrestaurant}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    container_name: ngrestaurant-web-dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
  postgres_data_dev:
